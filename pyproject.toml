[project]
name = "decision-transformer"
version = "0.1.0"
description = "Decision Transformer on CartPole: DQN dataset generation, DT/BC training and evaluation (CS 446)"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[classic-control]>=1.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "stable-baselines3>=2.9.2",
    "torch>=2.15.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
